name: Observability CI and Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'observability/**'
      - 'scripts/**'
      - '.github/workflows/observability-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'observability/**'
      - 'scripts/**'
      - '.github/workflows/observability-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose -f observability/docker-compose.yml config --quiet

      - name: Validate files and Python
        run: |
          set -euo pipefail
          test -f app/app.py
          test -f app/Dockerfile
          test -f observability/prometheus/prometheus.yml
          python -m json.tool observability/grafana/dashboards/sre-overview.json >/dev/null
          python -m pip install -r app/requirements.txt
          python -m py_compile app/app.py

  deploy:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: observability-deploy
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using access keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${INSTANCE_ID:?Set EC2_INSTANCE_ID in the observability-deploy environment}"

          PING_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)

          if [[ "$PING_STATUS" != "Online" ]]; then
            echo "Instance $INSTANCE_ID is not online in Systems Manager: $PING_STATUS"
            exit 1
          fi

          # Pass a script as individual SSM commands. Avoid interpolating
          # untrusted shell values into the remote script.
          COMMANDS=$(jq -cn \
            --arg repo "$REPO_URL" \
            --arg sha "$COMMIT_SHA" \
            '{
              commands: [
                "set -Eeuo pipefail",
                "REPO_URL=" + ($repo | @sh),
                "COMMIT_SHA=" + ($sha | @sh),
                "DIR=/opt/sre-observability-lab",
                "dnf install -y docker git curl",
                "systemctl enable --now docker",
                "if ! docker compose version >/dev/null 2>&1; then install -d -m 0755 /usr/local/lib/docker/cli-plugins; case \"$(uname -m)\" in x86_64) a=x86_64 ;; aarch64) a=aarch64 ;; *) exit 2 ;; esac; curl -fsSL \"https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${a}\" -o /usr/local/lib/docker/cli-plugins/docker-compose; chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose; fi",
                "if [ -d \"$DIR/.git\" ]; then git -C \"$DIR\" remote set-url origin \"$REPO_URL\"; git -C \"$DIR\" fetch --depth 1 origin \"$COMMIT_SHA\"; git -C \"$DIR\" checkout --force FETCH_HEAD; else install -d -m 0755 \"$(dirname \"$DIR\")\"; git clone --no-checkout \"$REPO_URL\" \"$DIR\"; git -C \"$DIR\" fetch --depth 1 origin \"$COMMIT_SHA\"; git -C \"$DIR\" checkout --force FETCH_HEAD; fi",
                "test -s \"$DIR/.env\" || { echo \"Missing $DIR/.env with GRAFANA_ADMIN_PASSWORD; provision it securely before deployment.\"; exit 3; }",
                "chmod 0600 \"$DIR/.env\"",
                "cd \"$DIR\"",
                "docker compose -f observability/docker-compose.yml config --quiet",
                "docker compose -f observability/docker-compose.yml up -d --build --remove-orphans",
                "docker compose -f observability/docker-compose.yml ps"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy observability commit $COMMIT_SHA" \
            --parameters "$COMMANDS" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query '{Status:Status,Output:StandardOutputContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for SSM command $COMMAND_ID"
          exit 1
