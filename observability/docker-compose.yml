name: sre-observability-lab
services:
  demo-api:
    build: ../app
    container_name: sre-demo-api
    restart: unless-stopped
    expose: ["8000"]
    networks: [observability]
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sre-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [observability]
    depends_on:
      demo-api:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: sre-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--web.listen-address=:9100"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    expose: ["9100"]
    networks: [observability]
    mem_limit: 128m
    cpus: 0.25

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: sre-alertmanager
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [observability]
    mem_limit: 128m
    cpus: 0.25

  grafana:
    image: grafana/grafana:12.1.0
    container_name: sre-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [observability]
    depends_on: [prometheus]
    mem_limit: 512m
    cpus: 0.75

networks:
  observability:
    name: sre-observability
    driver: bridge
volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
